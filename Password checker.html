<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PassForge Pro | High-Performance Cyber Engine</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #02050b;
            --card-bg: rgba(7, 13, 22, 0.78);
            --card-border: rgba(0, 240, 255, 0.2);
            --cyber-cyan: #00f0ff;
            --matrix-green: #00ff66;
            --alert-red: #ff2a4b;
            --amber-gold: #ff9900;
            --text-main: #f8fafc;
            --text-muted: #8096b1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* High-Definition Cyber Physics Canvas */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            background: radial-gradient(circle at 50% 50%, #08101d 0%, var(--bg-deep) 100%);
        }

        /* Ambient Dynamic Color Mesh */
        .mesh-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: 
                radial-gradient(at 10% 20%, rgba(0, 240, 255, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 10%, rgba(0, 255, 102, 0.12) 0px, transparent 50%),
                radial-gradient(at 80% 80%, rgba(139, 69, 19, 0.2) 0px, transparent 50%),
                radial-gradient(at 20% 90%, rgba(255, 42, 75, 0.15) 0px, transparent 50%);
            filter: blur(90px);
            animation: meshShift 10s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes meshShift {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.2) rotate(6deg); }
        }

        .header {
            text-align: center;
            max-width: 800px;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: -1.5px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--cyber-cyan), var(--matrix-green), var(--amber-gold));
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textGlow 8s ease infinite;
            text-shadow: 0 0 40px rgba(0, 240, 255, 0.3);
        }

        @keyframes textGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 500;
        }

        /* Glass Console Card */
        .unified-card {
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 40px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75), 0 0 30px rgba(0, 240, 255, 0.15);
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .unified-card:hover {
            border-color: rgba(0, 255, 102, 0.4);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.85), 0 0 45px rgba(0, 255, 102, 0.2);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 20px;
        }

        .card-header i {
            font-size: 1.8rem;
            color: #fff;
            background: linear-gradient(135deg, var(--cyber-cyan), var(--matrix-green));
            padding: 16px;
            border-radius: 18px;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
        }

        .card-header h2 {
            font-size: 1.6rem;
            font-weight: 700;
        }

        /* Controls */
        .input-box {
            position: relative;
            margin-bottom: 25px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 18px 24px;
            border-radius: 14px;
            border: 1px solid rgba(0, 240, 255, 0.25);
            background: rgba(2, 5, 11, 0.85);
            color: var(--text-main);
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            border-color: var(--matrix-green);
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.35);
        }

        .toggle-btn {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.2rem;
            transition: color 0.2s;
        }

        .toggle-btn:hover { color: var(--cyber-cyan); }

        .entropy-dashboard {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 25px;
            align-items: center;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 30px;
        }

        .gauge-svg {
            width: 110px;
            height: 110px;
            transform: rotate(-90deg);
        }

        .gauge-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.08);
            stroke-width: 9;
        }

        .gauge-progress {
            fill: none;
            stroke: var(--cyber-cyan);
            stroke-width: 9;
            stroke-dasharray: 251.2;
            stroke-dashoffset: 251.2;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.5s ease, stroke 0.5s ease;
        }

        .metrics-details {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .metric-score {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--cyber-cyan);
            font-family: 'JetBrains Mono', monospace;
        }

        .checklist {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .check-item {
            font-size: 0.88rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s;
        }

        .check-item.valid { color: var(--matrix-green); font-weight: 600; }

        .gen-config-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .slider-container {
            margin-bottom: 20px;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            outline: none;
            accent-color: var(--matrix-green);
            cursor: pointer;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            color: var(--text-muted);
            background: rgba(0, 0, 0, 0.25);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .checkbox-label:hover {
            border-color: rgba(0, 240, 255, 0.3);
            color: var(--text-main);
        }

        .checkbox-label input {
            accent-color: var(--cyber-cyan);
            width: 18px;
            height: 18px;
        }

        .action-group {
            display: flex;
            gap: 15px;
        }

        .btn-action {
            flex: 1;
            padding: 16px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, var(--cyber-cyan), var(--matrix-green));
            color: #000;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 6px 25px rgba(0, 240, 255, 0.3);
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 35px rgba(0, 255, 102, 0.45);
            filter: brightness(1.1);
        }

        .btn-copy {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-main);
            width: auto;
            padding: 0 24px;
        }

        .btn-copy:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: var(--cyber-cyan);
            color: var(--cyber-cyan);
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>
    <div class="mesh-gradient"></div>

    <div class="header">
        <h1>Entropy-X</h1>
        <p>Real-Time Passcode Security and Cryptographic Generator</p>
    </div>

    <div class="unified-card">
        <div class="card-header">
            <i class="fa-solid fa-lock-open"></i>
            <div>
                <h2>Passcode Security Hub</h2>
                <span style="font-size: 0.85rem; color: var(--text-muted);">Real-Time Entropy Analysis & Password Synthesis</span>
            </div>
        </div>

        <div class="input-box">
            <input type="password" id="passInput" placeholder="Enter or generate password..." oninput="evaluatePassword()">
            <button class="toggle-btn" onclick="toggleVisibility()"><i id="eyeIcon" class="fa-solid fa-eye"></i></button>
        </div>

        <div class="entropy-dashboard">
            <svg class="gauge-svg" viewBox="0 0 100 100">
                <circle class="gauge-bg" cx="50" cy="50" r="40"></circle>
                <circle id="gaugeProgress" class="gauge-progress" cx="50" cy="50" r="40"></circle>
            </svg>
            <div class="metrics-details">
                <div id="entropyBits" class="metric-score">0 Bits</div>
                <div id="statusText" style="font-size: 0.95rem; color: var(--text-muted); font-weight: 500;">Waiting for password input...</div>
                
                <div class="checklist">
                    <div id="check-len" class="check-item"><i class="fa-solid fa-circle-check"></i> 12+ Characters</div>
                    <div id="check-num" class="check-item"><i class="fa-solid fa-circle-check"></i> Numbers</div>
                    <div id="check-sym" class="check-item"><i class="fa-solid fa-circle-check"></i> Symbols</div>
                    <div id="check-cas" class="check-item"><i class="fa-solid fa-circle-check"></i> Mixed Case</div>
                </div>
            </div>
        </div>

        <div class="gen-config-title">
            <i class="fa-solid fa-sliders" style="color: var(--cyber-cyan);"></i> Passcode Customization Options
        </div>

        <div class="slider-container">
            <div class="slider-label">
                <span>Passcode Length</span>
                <span id="lengthVal" style="color: var(--matrix-green); font-weight: 700; font-family: 'JetBrains Mono', monospace;">18</span>
            </div>
            <input type="range" id="lenSlider" min="8" max="64" value="18" oninput="document.getElementById('lengthVal').innerText = this.value">
        </div>

        <div class="options-grid">
            <label class="checkbox-label"><input type="checkbox" id="optLower" checked> Lowercase (a-z)</label>
            <label class="checkbox-label"><input type="checkbox" id="optUpper" checked> Uppercase (A-Z)</label>
            <label class="checkbox-label"><input type="checkbox" id="optNum" checked> Numbers (0-9)</label>
            <label class="checkbox-label"><input type="checkbox" id="optSym" checked> Symbols (!@#$)</label>
        </div>

        <div class="action-group">
            <button class="btn-action" onclick="generateAndAnalyze()">
                <i class="fa-solid fa-key"></i> Generate Passcode
            </button>
            <button class="btn-action btn-copy" onclick="copyPassword()">
                <i class="fa-solid fa-copy"></i> Copy
            </button>
        </div>
    </div>

    <script>
        // --- High-Performance Vector Cyber Engine ---
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let elements = [];
        let mouse = { x: -1000, y: -1000, radius: 220 };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mouseleave', () => {
            mouse.x = -1000;
            mouse.y = -1000;
        });

        function resizeCanvas() {
            // High-DPI Resolution Scaling for Crisp Graphics
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            canvas.style.width = `${window.innerWidth}px`;
            canvas.style.height = `${window.innerHeight}px`;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // High-Quality FontAwesome & Cryptographic Vector Icons
        const cyberSymbols = [
            { type: 'icon', char: '\uf023' }, // Lock
            { type: 'icon', char: '\uf084' }, // Key
            { type: 'icon', char: '\uf3ed' }, // Shield
            { type: 'icon', char: '\uf120' }, // Terminal
            { type: 'icon', char: '\uf233' }, // Server
            { type: 'icon', char: '\uf135' }, // Rocket/Speed
            { type: 'icon', char: '\uf0e0' }, // Encrypted Mail
            { type: 'text', char: '0x4F' },
            { type: 'text', char: 'AES-256' },
            { type: 'text', char: 'SHA-512' },
            { type: 'text', char: 'RSA-4096' },
            { type: 'text', char: '[10110]' }
        ];

        class CyberElement {
            constructor() {
                this.init();
            }

            init() {
                this.x = Math.random() * window.innerWidth;
                this.y = Math.random() * window.innerHeight;
                this.size = Math.random() * 14 + 16;
                this.item = cyberSymbols[Math.floor(Math.random() * cyberSymbols.length)];
                
                // Accelerated Velocity Speeds (2.5x Speed Boost)
                this.vx = (Math.random() - 0.5) * 3.2;
                this.vy = (Math.random() - 0.5) * 3.2;
                
                this.defaultColor = Math.random() > 0.5 ? '#00f0ff' : '#00ff66';
                this.currentColor = this.defaultColor;
                this.opacity = Math.random() * 0.5 + 0.3;
                this.angle = Math.random() * Math.PI * 2;
                this.angularVelocity = (Math.random() - 0.5) * 0.08; // Dynamic rotations
            }

            update() {
                // High-Speed Continuous Traversal
                this.x += this.vx;
                this.y += this.vy;
                this.angle += this.angularVelocity;

                // Screen Wrap-Around Boundaries
                if (this.x < -50) this.x = window.innerWidth + 50;
                if (this.x > window.innerWidth + 50) this.x = -50;
                if (this.y < -50) this.y = window.innerHeight + 50;
                if (this.y > window.innerHeight + 50) this.y = -50;

                // Accelerated Reactive Cursor Repulsion Physics
                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < mouse.radius) {
                    const forceDirectionX = dx / distance;
                    const forceDirectionY = dy / distance;
                    const force = (mouse.radius - distance) / mouse.radius;
                    
                    // High-Velocity Evasion Push
                    this.x -= forceDirectionX * force * 15;
                    this.y -= forceDirectionY * force * 15;
                    
                    // Alert Crimson Red Color Transformation
                    this.currentColor = '#ff2a4b';
                } else {
                    this.currentColor = this.defaultColor;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.currentColor;
                ctx.shadowBlur = 18;
                ctx.shadowColor = this.currentColor;
                
                if (this.item.type === 'icon') {
                    ctx.font = `900 ${this.size}px "Font Awesome 6 Free"`;
                } else {
                    ctx.font = `700 ${this.size * 0.85}px "JetBrains Mono"`;
                }
                
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.item.char, 0, 0);
                ctx.restore();
            }
        }

        function initElements() {
            elements = [];
            const count = Math.floor((window.innerWidth * window.innerHeight) / 14000);
            for (let i = 0; i < Math.max(count, 55); i++) {
                elements.push(new CyberElement());
            }
        }
        initElements();

        function animateCanvas() {
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

            // Dynamic Vector Linkages
            for (let a = 0; a < elements.length; a++) {
                for (let b = a + 1; b < elements.length; b++) {
                    const dx = elements[a].x - elements[b].x;
                    const dy = elements[a].y - elements[b].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 130) {
                        const alpha = (1 - dist / 130) * 0.22;
                        ctx.strokeStyle = `rgba(0, 240, 255, ${alpha})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(elements[a].x, elements[a].y);
                        ctx.lineTo(elements[b].x, elements[b].y);
                        ctx.stroke();
                    }
                }
            }

            elements.forEach(el => {
                el.update();
                el.draw();
            });

            requestAnimationFrame(animateCanvas);
        }
        
        // Ensure FontAwesome is loaded before drawing icons
        document.fonts.ready.then(() => {
            animateCanvas();
        });

        // --- Core Application Logic ---
        function toggleVisibility() {
            const input = document.getElementById('passInput');
            const icon = document.getElementById('eyeIcon');
            input.type = input.type === 'password' ? 'text' : 'password';
            icon.className = input.type === 'password' ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash';
        }

        function evaluatePassword() {
            const pass = document.getElementById('passInput').value;
            const gauge = document.getElementById('gaugeProgress');
            const bitsText = document.getElementById('entropyBits');
            const status = document.getElementById('statusText');

            document.getElementById('check-len').className = pass.length >= 12 ? 'check-item valid' : 'check-item';
            document.getElementById('check-num').className = /[0-9]/.test(pass) ? 'check-item valid' : 'check-item';
            document.getElementById('check-sym').className = /[^a-zA-Z0-9]/.test(pass) ? 'check-item valid' : 'check-item';
            document.getElementById('check-cas').className = (/[a-z]/.test(pass) && /[A-Z]/.test(pass)) ? 'check-item valid' : 'check-item';

            if (!pass) {
                gauge.style.strokeDashoffset = '251.2';
                bitsText.innerText = '0 Bits';
                status.innerText = 'Waiting for password input...';
                status.style.color = 'var(--text-muted)';
                return;
            }

            let pool = 0;
            if (/[a-z]/.test(pass)) pool += 26;
            if (/[A-Z]/.test(pass)) pool += 26;
            if (/[0-9]/.test(pass)) pool += 10;
            if (/[^a-zA-Z0-9]/.test(pass)) pool += 32;

            const entropy = Math.round(pass.length * Math.log2(pool || 1));
            bitsText.innerText = `${entropy} Bits`;

            const maxEntropy = 120;
            const progress = Math.min(entropy / maxEntropy, 1);
            const offset = 251.2 - (251.2 * progress);
            gauge.style.strokeDashoffset = offset;

            if (entropy < 35) {
                gauge.style.stroke = 'var(--alert-red)';
                status.innerText = 'Critical Risk: Weak Password';
                status.style.color = 'var(--alert-red)';
            } else if (entropy < 65) {
                gauge.style.stroke = 'var(--amber-gold)';
                status.innerText = 'Moderate Security Level';
                status.style.color = 'var(--amber-gold)';
            } else if (entropy < 90) {
                gauge.style.stroke = 'var(--cyber-cyan)';
                status.innerText = 'High Strength Protection';
                status.style.color = 'var(--cyber-cyan)';
            } else {
                gauge.style.stroke = 'var(--matrix-green)';
                status.innerText = 'Cryptographically Unbreakable';
                status.style.color = 'var(--matrix-green)';
            }
        }

        function generateAndAnalyze() {
            const len = parseInt(document.getElementById('lenSlider').value);
            let chars = "";
            if (document.getElementById('optLower').checked) chars += "abcdefghijklmnopqrstuvwxyz";
            if (document.getElementById('optUpper').checked) chars += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            if (document.getElementById('optNum').checked) chars += "0123456789";
            if (document.getElementById('optSym').checked) chars += "!@#$%^&*()_+-=[]{}|;:,.<>?";

            if (!chars) {
                alert("Please select at least one character set!");
                return;
            }

            let pass = "";
            const array = new Uint32Array(len);
            crypto.getRandomValues(array);
            for (let i = 0; i < len; i++) {
                pass += chars[array[i] % chars.length];
            }

            const input = document.getElementById('passInput');
            input.value = pass;
            evaluatePassword();
        }

        function copyPassword() {
            const input = document.getElementById('passInput');
            if (input.value) {
                navigator.clipboard.writeText(input.value);
                alert("Passcode copied to clipboard!");
            }
        }
    </script>
</body>
</html>
